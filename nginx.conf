# 브라우저 입장에서는 화면과 API 가 같은 주소(같은 출처)라서 CORS 없이 동작하고,
# refresh token 쿠키(SameSite=Strict)도 정상적으로 전송된다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 첨부파일 업로드 허용 크기 (기본값 1MB → 백엔드 제한 5MB 보다 여유 있게)
    client_max_body_size 10m;

    # API 요청은 백엔드 컨테이너로 전달
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx 가 만든 요청 ID 를 백엔드로 전달 → nginx 접근 로그와 백엔드 로그를 같은 ID 로 찾을 수 있음
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s; # AI 응답 대기
    }

    # SNS 로그인 시작(/oauth2/...)과 제공자 콜백(/login/oauth2/...)은 백엔드가 처리
    # (/login 화면 자체는 아래 SPA 규칙으로 프론트가 그린다)
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 빌드 산출물은 파일명에 해시가 붙어 있어 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /tickets/3 같은 경로로 새로고침해도 index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
