# 브라우저 입장에서는 화면과 API 가 같은 주소(같은 출처)라서 CORS 없이 동작하고,
# refresh token 쿠키(SameSite=Strict)도 정상적으로 전송된다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 요청은 백엔드 컨테이너로 전달
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s; # AI 응답 대기
    }

    # 빌드 산출물은 파일명에 해시가 붙어 있어 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /tickets/3 같은 경로로 새로고침해도 index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
